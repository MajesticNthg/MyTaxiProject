<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои предприятия</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .navbar-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: white;
        }
        .navbar-custom .nav-link:hover {
            color: rgba(255,255,255,0.8);
        }
        .card-enterprise {
            transition: 0.3s;
            cursor: pointer;
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .card-enterprise:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.25);
        }
        .card-enterprise .card-body {
            padding: 1.5rem;
        }
        .card-enterprise .card-title {
            color: #333;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .badge-employees {
            background: #667eea;
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 4rem;
            color: #dee2e6;
            margin-bottom: 1rem;
        }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 8px;
            padding: 0.4rem 1rem;
            transition: 0.3s;
            text-decoration: none;
        }
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
            color: white;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="#">
            <i class="bi bi-taxi-front"></i> MyTaxi
        </a>
        <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-white" id="usernameDisplay">
                    <i class="bi bi-person-circle"></i> Менеджер
                </span>
            <a href="#" class="logout-btn" id="logoutBtn">
                <i class="bi bi-box-arrow-right"></i> Выйти
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-building"></i> Мои предприятия</h2>
        <span class="badge bg-primary" id="enterpriseCount">0 предприятий</span>
    </div>

    <div id="enterprisesList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <!-- Карточки будут добавлены через JS -->
    </div>

    <div id="emptyState" class="empty-state" style="display:none;">
        <i class="bi bi-building"></i>
        <h5>У вас нет доступных предприятий</h5>
        <p class="text-muted">Обратитесь к администратору для добавления прав</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = 'http://172.18.160.1:8080';

    function getToken() {
        return localStorage.getItem('token');
    }

    function redirectToLogin() {
        window.location.href = '/login.html';
    }

    async function fetchWithAuth(url, options = {}) {
        const token = getToken();
        if (!token) {
            redirectToLogin();
            return;
        }
        const response = await fetch(url, {
            ...options,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
                ...options.headers
            }
        });
        if (response.status === 401 || response.status === 403) {
            localStorage.removeItem('token');
            redirectToLogin();
            return;
        }
        return response;
    }

    async function loadEnterprises() {
        try {
            const response = await fetchWithAuth(`${API_BASE}/api/enterprises`);
            if (!response) return;
            if (!response.ok) {
                console.error('Failed to load enterprises:', response.status);
                return;
            }

            const enterprises = await response.json();
            renderEnterprises(enterprises);
        } catch (error) {
            console.error('Error loading enterprises:', error);
        }
    }

    function renderEnterprises(enterprises) {
        const container = document.getElementById('enterprisesList');
        const emptyState = document.getElementById('emptyState');
        const countBadge = document.getElementById('enterpriseCount');

        countBadge.textContent = `${enterprises.length} предприятий`;

        if (!enterprises || enterprises.length === 0) {
            container.innerHTML = '';
            emptyState.style.display = 'block';
            return;
        }
        emptyState.style.display = 'none';

        container.innerHTML = enterprises.map(enterprise => `
            <div class="col">
                <div class="card card-enterprise h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="card-title">${enterprise.name}</h5>
                            <span class="badge-employees">${enterprise.employeeCount || 0} сотрудников</span>
                        </div>
                        <p class="card-text text-muted mb-1">
                            <i class="bi bi-geo-alt"></i> ${enterprise.city || 'Город не указан'}
                        </p>
                        <p class="card-text text-muted mb-3">
                            <i class="bi bi-person-badge"></i>
                            ${enterprise.managers ? enterprise.managers.length : 0} менеджеров
                        </p>
                        <button class="btn btn-outline-primary btn-sm w-100"
                                onclick="viewEnterprise(${enterprise.id})">
                            <i class="bi bi-eye"></i> Подробнее
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function viewEnterprise(id) {
        alert(`Переход к предприятию ID: ${id}`);
        // window.location.href = `/enterprise.html?id=${id}`;
    }

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('token');
        window.location.href = '/login.html';
    });

    document.addEventListener('DOMContentLoaded', () => {
        const token = getToken();
        if (!token) {
            redirectToLogin();
            return;
        }
        // Показываем имя пользователя (из JWT)
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            document.getElementById('usernameDisplay').innerHTML =
                `<i class="bi bi-person-circle"></i> ${payload.sub || 'Менеджер'}`;
        } catch (e) {
            console.warn('Could not parse token');
        }
        loadEnterprises();
    });
</script>
</body>
</html>
