<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Машины предприятия</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .navbar-custom { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link { color: white; }
        .card-car { transition: 0.3s; cursor: pointer; border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .card-car:hover { transform: translateY(-5px); box-shadow: 0 8px 30px rgba(102, 126, 234, 0.25); }
        .logout-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 8px; padding: 0.4rem 1rem; text-decoration: none; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="/enterprises.html">
            <i class="bi bi-arrow-left"></i> Назад к предприятиям
        </a>
        <div class="ms-auto">
            <a href="#" class="logout-btn" id="logoutBtn">
                <i class="bi bi-box-arrow-right"></i> Выйти
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 id="enterpriseName">Машины предприятия</h2>
    <p class="text-muted" id="enterpriseCity"></p>

    <div id="carsList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mt-3"></div>

    <div id="emptyState" class="text-center py-5" style="display:none;">
        <i class="bi bi-car-front" style="font-size: 4rem; color: #dee2e6;"></i>
        <h5 class="mt-3">Нет машин</h5>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = 'http://172.18.160.1:8080';
    const urlParams = new URLSearchParams(window.location.search);
    const enterpriseId = urlParams.get('enterpriseId');

    if (!enterpriseId) window.location.href = '/enterprises.html';

    function getToken() { return localStorage.getItem('token'); }
    function redirectToLogin() { localStorage.removeItem('token'); window.location.href = '/login.html'; }

    async function fetchWithAuth(url, options = {}) {
        const token = getToken();
        if (!token) { redirectToLogin(); return; }
        const response = await fetch(url, {
            ...options,
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers }
        });
        if (response.status === 401 || response.status === 403) { redirectToLogin(); return; }
        return response;
    }

    async function loadEnterprise() {
        const response = await fetchWithAuth(`${API_BASE}/api/enterprises/${enterpriseId}`);
        if (!response) return;
        const enterprise = await response.json();
        document.getElementById('enterpriseName').textContent = 'Машины: ' + enterprise.name;
        document.getElementById('enterpriseCity').textContent = enterprise.city || '';
    }

    async function loadCars() {
        const response = await fetchWithAuth(`${API_BASE}/api/cars/paginated?enterpriseId=${enterpriseId}&page=0&size=100`);
        if (!response) return;
        const data = await response.json();
        renderCars(data.content || []);
    }

    function renderCars(cars) {
        const container = document.getElementById('carsList');
        const emptyState = document.getElementById('emptyState');

        if (!cars.length) { container.innerHTML = ''; emptyState.style.display = 'block'; return; }
        emptyState.style.display = 'none';

        container.innerHTML = cars.map(car => `
            <div class="col">
                <div class="card card-car h-100" onclick="viewCar(${car.id})">
                    <div class="card-body">
                        <h5 class="card-title">${car.licensePlate || 'Без номера'}</h5>
                        <p class="card-text text-muted mb-1">Год: ${car.yearOfRelease || '—'}</p>
                        <p class="card-text text-muted mb-1">Пробег: ${car.carMileage || '0'} км</p>
                        <p class="card-text text-muted">Цена: ${car.price ? car.price.toLocaleString() + ' ₽' : '—'}</p>
                        <button class="btn btn-outline-primary btn-sm w-100">
                            <i class="bi bi-eye"></i> Подробнее
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function viewCar(id) {
        window.location.href = `/car.html?carId=${id}&enterpriseId=${enterpriseId}`;
    }

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('token');
        window.location.href = '/login.html';
    });

    document.addEventListener('DOMContentLoaded', () => {
        if (!getToken()) { redirectToLogin(); return; }
        loadEnterprise();
        loadCars();
    });
</script>
</body>
</html>
