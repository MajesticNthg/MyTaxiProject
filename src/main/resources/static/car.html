<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Детали машины</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        .navbar-custom { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link { color: white; }
        #map { height: 500px; border-radius: 12px; }
        .logout-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 8px; padding: 0.4rem 1rem; text-decoration: none; }
        .trip-row { cursor: pointer; }
        .trip-row:hover { background-color: #f8f9fa; }
        .trip-row.selected { background-color: #e7f1ff; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="#" id="backLink">
            <i class="bi bi-arrow-left"></i> Назад к машинам
        </a>
        <div class="ms-auto">
            <a href="#" class="logout-btn" id="logoutBtn">
                <i class="bi bi-box-arrow-right"></i> Выйти
            </a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <!-- Информация о машине -->
    <div class="card mb-4" style="border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
        <div class="card-body">
            <h3 id="carTitle">Машина</h3>
            <div class="row mt-3">
                <div class="col-md-3"><strong>Год:</strong> <span id="carYear">—</span></div>
                <div class="col-md-3"><strong>Пробег:</strong> <span id="carMileage">—</span></div>
                <div class="col-md-3"><strong>Цена:</strong> <span id="carPrice">—</span></div>
                <div class="col-md-3"><strong>Бренд:</strong> <span id="carBrand">—</span></div>
            </div>
        </div>
    </div>

    <!-- Фильтр по датам -->
    <div class="card mb-4" style="border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
        <div class="card-body">
            <h5><i class="bi bi-calendar"></i> Поездки</h5>
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">С</label>
                    <input type="datetime-local" class="form-control" id="fromDate">
                </div>
                <div class="col-md-4">
                    <label class="form-label">По</label>
                    <input type="datetime-local" class="form-control" id="toDate">
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary w-100" id="loadTripsBtn">
                        <i class="bi bi-search"></i> Загрузить
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Список поездок -->
    <div class="card mb-4" style="border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Поездки</h5>
                <button class="btn btn-outline-primary btn-sm" id="showAllTripsBtn">
                    <i class="bi bi-map"></i> Показать все треки
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Начало</th>
                        <th>Конец</th>
                        <th>Откуда</th>
                        <th>Куда</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="tripsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Карта -->
    <div class="card mb-4" style="border-radius: 12px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
        <div class="card-body">
            <h5><i class="bi bi-map"></i> Трек на карте</h5>
            <div id="map"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const API_BASE = 'http://172.18.160.1:8080';
    const urlParams = new URLSearchParams(window.location.search);
    const carId = urlParams.get('carId');
    const enterpriseId = urlParams.get('id');

    if (!carId) window.location.href = '/enterprises.html';

    let map;
    let currentLayers = [];

    function getToken() { return localStorage.getItem('token'); }
    function redirectToLogin() { localStorage.removeItem('token'); window.location.href = '/login.html'; }

    async function fetchWithAuth(url, options = {}) {
        const token = getToken();
        if (!token) { redirectToLogin(); return; }
        const response = await fetch(url, {
            ...options,
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...options.headers }
        });
        if (response.status === 401 || response.status === 403) { redirectToLogin(); return; }
        return response;
    }

    function initMap() {
        map = L.map('map').setView([55.7558, 37.6173], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
    }

    function clearMap() {
        currentLayers.forEach(layer => map.removeLayer(layer));
        currentLayers = [];
    }

    async function loadCar() {
        const response = await fetchWithAuth(`${API_BASE}/api/cars/${carId}`);
        if (!response) return;
        const car = await response.json();

        document.getElementById('carTitle').textContent = car.licensePlate || 'Машина';
        document.getElementById('carYear').textContent = car.yearOfRelease || '—';
        document.getElementById('carMileage').textContent = (car.carMileage || '0') + ' км';
        document.getElementById('carPrice').textContent = car.price ? car.price.toLocaleString() + ' ₽' : '—';
        document.getElementById('carBrand').textContent = car.brandName || '—';
    }

    async function loadTrips() {
        const from = document.getElementById('fromDate').value;
        const to = document.getElementById('toDate').value;

        if (!from || !to) { alert('Выберите диапазон дат'); return; }

        const url = `${API_BASE}/api/trips/list?carId=${carId}&from=${from}:00&to=${to}:59`;

        const response = await fetchWithAuth(url);
        if (!response) return;
        const trips = await response.json();

        renderTrips(trips);
    }

    function renderTrips(trips) {
        const tbody = document.getElementById('tripsTableBody');

        if (!trips.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Поездок нет</td></tr>';
            return;
        }

        tbody.innerHTML = trips.map(trip => `
            <tr class="trip-row" onclick="showTripTrack(${trip.tripId})">
                <td>${trip.tripId}</td>
                <td>${trip.startTime}</td>
                <td>${trip.endTime}</td>
                <td>${trip.startAddress || '—'}</td>
                <td>${trip.endAddress || '—'}</td>
                <td><button class="btn btn-sm btn-outline-primary"><i class="bi bi-map"></i></button></td>
            </tr>
        `).join('');
    }

    async function showTripTrack(tripId) {
        clearMap();

        const from = document.getElementById('fromDate').value;
        const to = document.getElementById('toDate').value;

        const url = `${API_BASE}/api/trips/track?carId=${carId}&from=${from}:00&to=${to}:59`;

        const response = await fetchWithAuth(url);
        if (!response) return;
        const points = await response.json();

        const tripPoints = points.filter(p => p.tripId === tripId);
        if (!tripPoints.length) { alert('Точек нет'); return; }

        const coords = tripPoints.map(p => [p.latitude, p.longitude]);

        const polyline = L.polyline(coords, { color: 'blue', weight: 4 }).addTo(map);
        currentLayers.push(polyline);

        map.fitBounds(polyline.getBounds());
    }

    async function showAllTrips() {
        clearMap();

        const from = document.getElementById('fromDate').value;
        const to = document.getElementById('toDate').value;

        if (!from || !to) { alert('Выберите диапазон дат'); return; }

        const url = `${API_BASE}/api/trips/track?carId=${carId}&from=${from}:00&to=${to}:59`;

        const response = await fetchWithAuth(url);
        if (!response) return;
        const points = await response.json();

        if (!points.length) { alert('Точек нет'); return; }

        const tripsMap = {};
        points.forEach(p => {
            if (!tripsMap[p.tripId]) tripsMap[p.tripId] = [];
            tripsMap[p.tripId].push([p.latitude, p.longitude]);
        });

        const colors = ['blue', 'red', 'green', 'orange', 'purple', 'brown'];
        let colorIndex = 0;
        const allBounds = [];

        for (const tripId in tripsMap) {
            const coords = tripsMap[tripId];
            const color = colors[colorIndex % colors.length];

            const polyline = L.polyline(coords, { color: color, weight: 4 })
                .bindPopup(`Поездка #${tripId}`)
                .addTo(map);

            currentLayers.push(polyline);
            allBounds.push(polyline.getBounds());
            colorIndex++;
        }

        if (allBounds.length) {
            const combinedBounds = allBounds.reduce((acc, b) => acc.extend(b), allBounds[0]);
            map.fitBounds(combinedBounds);
        }
    }

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('token');
        window.location.href = '/login.html';
    });

    document.getElementById('loadTripsBtn').addEventListener('click', loadTrips);
    document.getElementById('showAllTripsBtn').addEventListener('click', showAllTrips);

    document.addEventListener('DOMContentLoaded', () => {
        if (!getToken()) { redirectToLogin(); return; }

        document.getElementById('backLink').href = `/cars.html?enterpriseId=${enterpriseId}`;

        const now = new Date();
        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
        const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);

        document.getElementById('fromDate').value = firstDay.toISOString().slice(0, 16);
        document.getElementById('toDate').value = lastDay.toISOString().slice(0, 16);

        initMap();
        loadCar();
        loadTrips();
    });
</script>
</body>
</html>
