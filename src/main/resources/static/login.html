<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            border-radius: 15px;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .login-card h3 {
            color: #333;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .btn-primary {
            background: #667eea;
            border: none;
            width: 100%;
            padding: 0.75rem;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background: #5a6fd6;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .error-message {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h3>Вход в систему</h3>
    <form id="loginForm">
        <div class="mb-3">
            <label for="username" class="form-label">Имя пользователя</label>
            <input type="text" class="form-control" id="username" placeholder="Введите логин" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="password" placeholder="Введите пароль" required>
        </div>
        <div id="errorMessage" class="error-message" style="display:none;">❌ Неверный логин или пароль</div>
        <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    <div class="text-center mt-3">
        <small class="text-muted">Такси-сервис MyTaxi</small>
    </div>
</div>

<script>
    const API_BASE = 'http://172.18.160.1:8080';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('errorMessage');

        try {
            const response = await fetch(`${API_BASE}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (!response.ok) {
                errorEl.style.display = 'block';
                return;
            }

            const data = await response.json();
            localStorage.setItem('token', data.token);
            window.location.href = '/enterprises.html';
        } catch (error) {
            errorEl.style.display = 'block';
            console.error('Login error:', error);
        }
    });
</script>
</body>
</html>
