<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: 'Arial', sans-serif; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #667eea; color: white; }
        .title { font-size: 24px; color: #333; }
        .chart-container { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
<h1 class="title" th:text="${report.name}">Название отчёта</h1>
<p>Период: <span th:text="${report.startDate}"></span> - <span th:text="${report.endDate}"></span></p>

<table>
    <thead>
    <tr>
        <th>Период</th>
        <th>Значение</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${report.items}">
        <td th:text="${item.period}"></td>
        <td th:text="${item.value + ' ' + item.unit}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
