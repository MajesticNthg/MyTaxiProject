<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавление менеджера</title>
    <style>
        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        button {
            padding: 8px 16px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .cancel {
            display: inline-block;
            padding: 8px 16px;
            background-color: #ccc;
            color: black;
            text-decoration: none;
            font-size: 14px;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Добавление менеджера</h1>

    <form action="#" th:action="@{/managers/save}" th:object="${manager}" method="post">
        <div class="form-group">
            <label>Логин:</label>
            <input type="text" th:field="*{username}" required>
        </div>
        <div class="form-group">
            <label>Пароль:</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-group">
            <label>ФИО:</label>
            <input type="text" th:field="*{fullName}" required>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" th:field="*{email}" required>
        </div>
        <button type="submit">Сохранить</button>
        <a href="/managers" class="cancel">Отмена</a>
    </form>
</div>
</body>
</html>
