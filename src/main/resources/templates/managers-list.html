<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список менеджеров</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border: 1px solid #ddd;
        }

        h1 {
            color: #333
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
            font-weight: normal;
        }

        .buttons-group {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .add-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            color: black;
            cursor: pointer;
            text-decoration: none;
        }

        .delete-button {
            color: red;
            text-decoration: none;
            margin-left: 10px;
        }

        .edit-button {
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Список менеджеров</h1>

    <div class="buttons-group">
        <a href="/managers/new" class="add-button">+ Добавить менеджера</a>
        <a href="/cars" class="add-button">К списку автомобилей</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Логин</th>
            <th>ФИО</th>
            <th>Email</th>
            <th>Предприятия</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="manager : ${managers}">
            <td th:text="${manager.id}">1</td>
            <td th:text="${manager.username}">ivan</td>
            <td th:text="${manager.fullName}">Иван Иванов</td>
            <td th:text="${manager.email}">ivan@mail.ru</td>
            <td th:text="${manager.enterprises != null && !manager.enterprises.isEmpty() ?
                #strings.listJoin(manager.enterprises.![name], ', ') : '—'}">—</td>
            <td>
                <a th:href="@{/managers/edit/{id}(id=${manager.id})}" class="edit-button">Изменить</a>
                <a th:href="@{/managers/delete/{id}(id=${manager.id})}"
                   class="delete-button"
                   th:onclick="'return confirm(\'Удалить менеджера с ID ' + ${manager.id} + '?\')'">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${managers.isEmpty()}" style="margin-top: 20px; color: #999;">
        Пока нет добавленных менеджеров.
    </div>
</div>
</body>
</html>
